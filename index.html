<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimacion COCOMO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Estimación con COCOMO básico</h1>
        <p>Ingresa el tamaño del proyecto en KLOC y selecciona el modo de desarrollo.</p>

        <label for="proyecto">Proyecto</label>
        <input type="text" id="proyecto" placeholder="Ej. Hawk">

        <label for="kloc">Tamaño (KLOC)</label>
        <input type="number" id="kloc" min="0" step="0.1">

        <label for="modo">Modo</label>
        <select id="modo">
            <option value="organico">Orgánico</option>
            <option value="semi">Semi-acoplado</option>
            <option value="empotrado">Empotrado</option>
        </select>

        <button id="calcular">Calcular</button>

        <div id="resultado">
            <h2 id="titulo"></h2>
            <table>
                <tr>
                    <td>Esfuerzo (E)</td>
                    <td id="esfuerzo"></td>
                </tr>
                <tr>
                    <td>Tiempo de desarrollo (D)</td>
                    <td id="tiempo"></td>
                </tr>
                <tr>
                    <td>Personal promedio (P)</td>
                    <td id="personas"></td>
                </tr>
            </table>
            <p class="constantes" id="constantes"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
